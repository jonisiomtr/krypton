<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{websiteTitle}}</title>
  <meta name="description" content="{{websiteDescription}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: {{primaryColor}};
      --secondary: {{secondaryColor}};
      --accent: {{accentColor}};
      --background: {{backgroundColor}};
      --text: {{textColor}};
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--background);
      color: var(--text);
      line-height: 1.6;
    }
    
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
      padding: 4rem 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="p" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1" fill="white" opacity="0.1"/></pattern></defs><rect fill="url(%23p)" width="100" height="100"/></svg>');
      opacity: 0.3;
    }
    
    .header-content {
      position: relative;
      z-index: 1;
    }
    
    .logo {
      max-width: 180px;
      max-height: 180px;
      border-radius: 20px;
      margin-bottom: 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      background: white;
      padding: 10px;
    }
    
    .hero-title {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    
    .hero-subtitle {
      font-size: 1.4rem;
      opacity: 0.95;
      font-weight: 300;
    }
    
    .company-info {
      max-width: 900px;
      margin: 3rem auto;
      padding: 0 1.5rem;
      text-align: center;
    }
    
    .company-info h2 {
      font-size: 2.2rem;
      color: var(--primary);
      margin-bottom: 1rem;
    }
    
    .company-info p {
      font-size: 1.1rem;
      color: var(--text);
      opacity: 0.8;
      max-width: 700px;
      margin: 0 auto;
    }
    
    .products-section {
      max-width: 1400px;
      margin: 4rem auto;
      padding: 0 1.5rem;
    }
    
    .products-title {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 3rem;
      color: var(--primary);
      font-weight: 700;
    }
    
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2.5rem;
    }
    
    .product-card {
      background: white;
      border-radius: 20px;
      padding: 0;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }
    
    .product-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }
    
    .product-image {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 20px 20px 0 0;
    }
    
    .product-content {
      padding: 1.5rem;
    }
    
    .product-name {
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
      color: var(--primary);
      font-weight: 600;
    }
    
    .product-description {
      color: #666;
      margin-bottom: 1rem;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    
    .product-price {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
    }
    
    .footer {
      background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
      color: white;
      text-align: center;
      padding: 3rem 2rem;
      margin-top: 5rem;
    }
    
    .footer h3 {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
    }
    
    .contact-info {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }
    
    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.1rem;
    }
    
    .contact-item span {
      opacity: 0.9;
    }
    
    @media (max-width: 768px) {
      .header {
        padding: 3rem 1.5rem;
      }
      
      .hero-title {
        font-size: 2rem;
      }
      
      .hero-subtitle {
        font-size: 1.1rem;
      }
      
      .products-grid {
        grid-template-columns: 1fr;
      }
      
      .contact-info {
        flex-direction: column;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <img src="{{companyLogo}}" alt="{{companyName}}" class="logo" style="display: {{showLogo}} === 'true' ? 'block' : 'none'">
      <h1 class="hero-title">{{heroTitle}}</h1>
      <p class="hero-subtitle">{{heroSubtitle}}</p>
    </div>
  </header>
  
  <section class="company-info">
    <h2>{{companyName}}</h2>
    <p>{{companyDescription}}</p>
  </section>
  
  <section class="products-section">
    <h2 class="products-title">Nossos Produtos</h2>
    <div class="products-grid">
      {{products}}
    </div>
  </section>
  
  <footer class="footer">
    <h3>{{companyName}}</h3>
    <div class="contact-info">
      <div class="contact-item">
        <span>📞</span>
        <span>{{companyPhone}}</span>
      </div>
      <div class="contact-item">
        <span>📧</span>
        <span>{{companyEmail}}</span>
      </div>
      <div class="contact-item">
        <span>📍</span>
        <span>{{companyAddress}}</span>
      </div>
    </div>
  </footer>
</body>
</html>
